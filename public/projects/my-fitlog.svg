<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#0C0D10"/>
  <rect x="0.5" y="0.5" width="799" height="499" stroke="#292D35"/>

  <!-- Top Navbar -->
  <rect width="800" height="55" fill="#0E1015"/>
  <line x1="0" y1="55" x2="800" y2="55" stroke="#292D35"/>

  <!-- Logo & Dumbbell Icon -->
  <g transform="translate(35, 17)">
    <circle cx="10" cy="10" r="9" fill="#1C2028"/>
    <path d="M6 10H14M7 7V13M13 7V13" stroke="#C2F800" stroke-width="2" stroke-linecap="round"/>
    <text x="26" y="15" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="1">FITLOG</text>
  </g>

  <!-- Nav links -->
  <text x="200" y="32" fill="#C2F800" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Home</text>
  <text x="255" y="32" fill="#9CA3AF" font-family="system-ui, sans-serif" font-weight="600" font-size="12">My Plan</text>
  <text x="320" y="32" fill="#9CA3AF" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Library</text>

  <!-- Right Header Badges -->
  <g transform="translate(630, 14)">
    <rect width="65" height="26" rx="4" fill="#1C2028" stroke="#292D35"/>
    <text x="12" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Plan</text>
    <rect x="42" y="5" width="16" height="16" rx="3" fill="#C2F800"/>
    <text x="47" y="17" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">3</text>
  </g>

  <g transform="translate(705, 14)">
    <rect width="65" height="26" rx="4" fill="#1C2028" stroke="#292D35"/>
    <text x="12" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Save</text>
    <rect x="42" y="5" width="16" height="16" rx="3" fill="#C2F800"/>
    <text x="47" y="17" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">5</text>
  </g>

  <!-- Hero Banner Card -->
  <g transform="translate(35, 75)">
    <rect width="730" height="145" rx="10" fill="#15171C" stroke="#292D35"/>
    
    <text x="30" y="36" fill="#C2F800" font-family="monospace" font-weight="bold" font-size="11" letter-spacing="2">WORKOUT LIBRARY</text>
    <text x="30" y="70" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="0.5">TRAIN WITH INTENT. LOG EVERY SET.</text>
    <text x="30" y="96" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">Discover exercises, build daily workout plans, and track your sets, reps &amp; recovery.</text>

    <!-- CTA Button -->
    <rect x="30" y="110" width="145" height="26" rx="4" fill="#C2F800"/>
    <text x="45" y="127" fill="#000000" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" letter-spacing="1">BROWSE WORKOUTS</text>

    <!-- Right Graphic / Icon -->
    <circle cx="650" cy="72" r="42" fill="#1F232B" stroke="#292D35"/>
    <path d="M632 72H668M636 60V84M664 60V84M644 66V78M656 66V78" stroke="#C2F800" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Section Header -->
  <text x="35" y="250" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">THE EXERCISE LIBRARY</text>
  <text x="35" y="268" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Twelve lifts covering every major muscle group</text>

  <!-- Exercise Card 1 -->
  <g transform="translate(35, 285)">
    <rect width="350" height="185" rx="8" fill="#15171C" stroke="#292D35"/>
    
    <!-- Exercise Image Placeholder with visual bar -->
    <rect x="15" y="15" width="320" height="60" rx="6" fill="#1C2028"/>
    <path d="M60 45H290M100 30V60M110 33V57M250 33V57M260 30V60" stroke="#C2F800" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Badges -->
    <rect x="15" y="85" width="52" height="18" rx="9" fill="#C2F800"/>
    <text x="26" y="98" fill="#000000" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Chest</text>

    <rect x="73" y="85" width="50" height="18" rx="9" fill="#C2F800"/>
    <text x="86" y="98" fill="#000000" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Arms</text>

    <!-- Card Title & Desc -->
    <text x="15" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Barbell Bench Press</text>
    <text x="15" y="145" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Compound press building upper-body power &amp; triceps strength.</text>

    <!-- Stats footer -->
    <line x1="15" y1="158" x2="335" y2="158" stroke="#222630"/>
    <text x="15" y="174" fill="#C2F800" font-family="monospace" font-size="10">⏱ 25 min</text>
    <text x="140" y="174" fill="#C2F800" font-family="monospace" font-size="10">🔥 180 kcal</text>
    <text x="280" y="174" fill="#C2F800" font-family="monospace" font-size="10">★ 4.8 / 5.0</text>
  </g>

  <!-- Exercise Card 2 -->
  <g transform="translate(415, 285)">
    <rect width="350" height="185" rx="8" fill="#15171C" stroke="#292D35"/>
    
    <!-- Exercise Image Placeholder with visual bar -->
    <rect x="15" y="15" width="320" height="60" rx="6" fill="#1C2028"/>
    <path d="M120 35C150 55 200 55 230 35M175 35V65" stroke="#C2F800" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Badges -->
    <rect x="15" y="85" width="50" height="18" rx="9" fill="#C2F800"/>
    <text x="27" y="98" fill="#000000" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Back</text>

    <rect x="71" y="85" width="50" height="18" rx="9" fill="#C2F800"/>
    <text x="84" y="98" fill="#000000" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">Arms</text>

    <!-- Card Title & Desc -->
    <text x="15" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Weighted Pull-Up</text>
    <text x="15" y="145" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Vertical pull developing lat width, grip, and relative strength.</text>

    <!-- Stats footer -->
    <line x1="15" y1="158" x2="335" y2="158" stroke="#222630"/>
    <text x="15" y="174" fill="#C2F800" font-family="monospace" font-size="10">⏱ 15 min</text>
    <text x="140" y="174" fill="#C2F800" font-family="monospace" font-size="10">🔥 120 kcal</text>
    <text x="280" y="174" fill="#C2F800" font-family="monospace" font-size="10">★ 4.7 / 5.0</text>
  </g>
</svg>
