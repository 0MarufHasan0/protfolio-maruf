<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#141414"/>
  <rect x="0.5" y="0.5" width="799" height="499" stroke="#3A3A3A"/>
  
  <!-- Terminal Top Bar -->
  <rect width="800" height="40" fill="#202020"/>
  <circle cx="20" cy="20" r="5" fill="#444444"/>
  <circle cx="36" cy="20" r="5" fill="#444444"/>
  <circle cx="52" cy="20" r="5" fill="#444444"/>
  <text x="75" y="24" fill="#8C8C8C" font-family="monospace" font-size="11">bash - devblog-api/v1/routes</text>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#3A3A3A"/>

  <!-- Code / API Editor Content -->
  <text x="35" y="80" fill="#8C8C8C" font-family="monospace" font-size="12">// Express.js Enterprise Routing &amp; Middleware</text>
  <text x="35" y="105" fill="#00FF41" font-family="monospace" font-size="13">import</text>
  <text x="90" y="105" fill="#FFFFFF" font-family="monospace" font-size="13">{ Router } from "express";</text>
  <text x="35" y="130" fill="#00FF41" font-family="monospace" font-size="13">import</text>
  <text x="90" y="130" fill="#FFFFFF" font-family="monospace" font-size="13">{ verifyJWT, rateLimiter } from "../middleware";</text>
  
  <text x="35" y="170" fill="#6366F1" font-family="monospace" font-size="13">const</text>
  <text x="80" y="170" fill="#FFFFFF" font-family="monospace" font-size="13">api = Router();</text>

  <!-- Route 1 -->
  <rect x="35" y="195" width="730" height="42" fill="#1C1C1C" stroke="#2E2E2E"/>
  <rect x="50" y="206" width="46" height="20" fill="#00FF41"/>
  <text x="56" y="220" fill="#141414" font-family="monospace" font-size="10" font-weight="bold">GET</text>
  <text x="110" y="221" fill="#FFFFFF" font-family="monospace" font-size="12">/api/v1/posts/:slug</text>
  <text x="540" y="221" fill="#8C8C8C" font-family="monospace" font-size="11">200 OK • 18ms • Cached</text>

  <!-- Route 2 -->
  <rect x="35" y="247" width="730" height="42" fill="#1C1C1C" stroke="#2E2E2E"/>
  <rect x="50" y="258" width="54" height="20" fill="#3B82F6"/>
  <text x="56" y="272" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">POST</text>
  <text x="120" y="273" fill="#FFFFFF" font-family="monospace" font-size="12">/api/v1/auth/session</text>
  <text x="540" y="273" fill="#8C8C8C" font-family="monospace" font-size="11">201 Created • Bearer JWT</text>

  <!-- Route 3 -->
  <rect x="35" y="299" width="730" height="42" fill="#1C1C1C" stroke="#2E2E2E"/>
  <rect x="50" y="310" width="46" height="20" fill="#F5B800"/>
  <text x="58" y="324" fill="#141414" font-family="monospace" font-size="10" font-weight="bold">PUT</text>
  <text x="110" y="325" fill="#FFFFFF" font-family="monospace" font-size="12">/api/v1/posts/:id/publish</text>
  <text x="540" y="325" fill="#8C8C8C" font-family="monospace" font-size="11">Role: ADMIN required</text>

  <!-- Terminal Live Log Output at bottom -->
  <rect x="35" y="360" width="730" height="110" fill="#181818" stroke="#3A3A3A"/>
  <text x="50" y="385" fill="#00FF41" font-family="monospace" font-size="11">● [SERVER] Express cluster listening on :8080 (3 workers online)</text>
  <text x="50" y="410" fill="#8C8C8C" font-family="monospace" font-size="11">✓ PostgreSQL connection pool connected (max_conn: 20)</text>
  <text x="50" y="435" fill="#8C8C8C" font-family="monospace" font-size="11">✓ Redis caching layer connected (redis://127.0.0.1:6379)</text>
  <text x="50" y="455" fill="#FFFFFF" font-family="monospace" font-size="11">$ <tspan fill="#00FF41">_</tspan></text>
</svg>
